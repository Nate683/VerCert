<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <!-- Faint marble veining for section headers. Stretched low-frequency
       turbulence pushed through a spiked alpha ramp leaves only the thin
       bone-coloured veins; the stone itself comes from the CSS gradient
       underneath. -->
  <filter id="veins" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.05" numOctaves="5" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.91  0 0 0 0 0.89  0 0 0 0 0.85  1 0 0 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0.85 0 0"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="220" filter="url(#veins)"/>
</svg>
