<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Pebbled leather tooth. Coarse fractal noise clipped to a narrow alpha
       band so it reads as grain rather than static. Tiled behind Command
       panels at low opacity with an overlay blend. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 0.75" numOctaves="4" seed="12" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0 0.02  0.9 0.3 0 0 -0.25"/>
  </filter>
  <rect width="300" height="300" filter="url(#grain)"/>
</svg>
