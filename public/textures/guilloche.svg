<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <!-- Banknote guilloche rosette. Used as a low-opacity engraving layer
       behind Command panels — the same lathe-work you'd find on a share
       certificate. Stroke colour is aged brass; opacity is set in CSS. -->
  <defs>
    <g id="rosette" fill="none" stroke="#B8912F" stroke-width="0.6">
      <ellipse rx="196" ry="74" transform="rotate(0)"/>
      <ellipse rx="196" ry="74" transform="rotate(12)"/>
      <ellipse rx="196" ry="74" transform="rotate(24)"/>
      <ellipse rx="196" ry="74" transform="rotate(36)"/>
      <ellipse rx="196" ry="74" transform="rotate(48)"/>
      <ellipse rx="196" ry="74" transform="rotate(60)"/>
      <ellipse rx="196" ry="74" transform="rotate(72)"/>
      <ellipse rx="196" ry="74" transform="rotate(84)"/>
      <ellipse rx="196" ry="74" transform="rotate(96)"/>
      <ellipse rx="196" ry="74" transform="rotate(108)"/>
      <ellipse rx="196" ry="74" transform="rotate(120)"/>
      <ellipse rx="196" ry="74" transform="rotate(132)"/>
      <ellipse rx="196" ry="74" transform="rotate(144)"/>
      <ellipse rx="196" ry="74" transform="rotate(156)"/>
      <ellipse rx="196" ry="74" transform="rotate(168)"/>
    </g>
    <g id="rosette-inner" fill="none" stroke="#B8912F" stroke-width="0.5">
      <ellipse rx="118" ry="42" transform="rotate(6)"/>
      <ellipse rx="118" ry="42" transform="rotate(24)"/>
      <ellipse rx="118" ry="42" transform="rotate(42)"/>
      <ellipse rx="118" ry="42" transform="rotate(60)"/>
      <ellipse rx="118" ry="42" transform="rotate(78)"/>
      <ellipse rx="118" ry="42" transform="rotate(96)"/>
      <ellipse rx="118" ry="42" transform="rotate(114)"/>
      <ellipse rx="118" ry="42" transform="rotate(132)"/>
      <ellipse rx="118" ry="42" transform="rotate(150)"/>
      <ellipse rx="118" ry="42" transform="rotate(168)"/>
    </g>
  </defs>
  <g transform="translate(220 220)">
    <use href="#rosette"/>
    <use href="#rosette-inner"/>
    <circle r="188" fill="none" stroke="#B8912F" stroke-width="0.8"/>
    <circle r="182" fill="none" stroke="#B8912F" stroke-width="0.4"/>
    <circle r="62" fill="none" stroke="#B8912F" stroke-width="0.6"/>
  </g>
</svg>
